<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OvenClear — label provenance</title>
<style>
  :root {
    --bg: #140D0A; --bg-2: #1C130F; --panel: #211610; --panel-2: #2A1D15;
    --border: #3B2A20; --border-2: #4A3427; --ink: #F4EAE2; --muted: #B49C8E; --muted-2: #8C7566;
    --terracotta: #C2552B; --amber: #F5B841; --green: #5FBE82; --green-ink: #9EE6B6; --red-ink: #FCA48F;
    --display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(900px 380px at 82% -8%, rgba(245,184,65,.10), transparent 60%), var(--bg);
    color: var(--ink); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 22px 64px; }
  a { color: var(--amber); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .back { font-size: 13px; color: var(--muted); }
  .head { display: flex; align-items: center; gap: 11px; margin-top: 14px; }
  .head .logo { font-size: 24px; }
  .head .name { font-family: var(--display); font-size: 22px; }
  .head .name b { color: var(--amber); }
  .disclosure { margin-top: 16px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(245,184,65,.34); background: rgba(245,184,65,.07); color: #F0DCC3; font-size: 12.5px; display: flex; gap: 10px; align-items: center; }
  .disclosure .tag { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--bg); background: var(--amber); padding: 2px 7px; border-radius: 5px; }
  .card { background: linear-gradient(180deg, var(--panel), var(--bg-2)); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 18px 44px -22px rgba(0,0,0,.8); margin-top: 20px; }
  .card .pad { padding: 22px; }
  .top { display: grid; grid-template-columns: 1fr 168px; gap: 22px; align-items: start; }
  @media (max-width: 620px) { .top { grid-template-columns: 1fr; } }
  .kv { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted-2); }
  .biz { font-family: var(--display); font-size: 24px; margin: 2px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .05em; padding: 5px 11px; border-radius: 8px; color: #0d2617; background: var(--green); margin-top: 12px; }
  .qr { background: #fff; padding: 12px; border-radius: 12px; border: 1px solid var(--border-2); }
  .qr svg { display: block; width: 100%; height: auto; }
  .qr-cap { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .mandated { margin-top: 18px; padding: 13px 15px; border-left: 3px solid var(--amber); background: rgba(245,184,65,.06); border-radius: 0 10px 10px 0; font-family: var(--mono); font-size: 13px; color: #F0E2D2; }
  .mandated .k { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--muted); }
  .chip b { color: #E7D3A6; font-weight: 600; }
  .chip.snap { border-color: rgba(245,184,65,.3); }
  h3.sec { font-family: var(--display); font-size: 18px; margin: 26px 0 4px; }
  .timeline { list-style: none; margin: 14px 0 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--border-2); }
  .ti { position: relative; padding: 0 0 20px 34px; }
  .ti:last-child { padding-bottom: 0; }
  .ti .dot { position: absolute; left: 1px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--terracotta); }
  .ti.current .dot { border-color: var(--green); background: rgba(95,190,130,.2); }
  .ti .when { font-family: var(--mono); font-size: 12px; color: var(--amber); }
  .ti .lid { font-family: var(--mono); font-size: 12.5px; color: var(--ink); margin-top: 2px; word-break: break-all; }
  .ti .reason { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .ti .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .signed { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--green-ink); }
  .signed .d { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(95,190,130,.8); }
  .pickers { display: grid; gap: 8px; margin-top: 14px; }
  .pickers a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-2); font-size: 13px; color: var(--ink); }
  .pickers a:hover { border-color: var(--amber); text-decoration: none; }
  .missing { padding: 30px; text-align: center; color: var(--muted); font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="missing">Loading provenance…</div></div>
<script src="data/verify-data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.OVENCLEAR_VERIFY;
  var app = document.getElementById("app");
  if (!D) { app.innerHTML = '<div class="missing">Run <b>npm run verify:dashboard</b> to generate the data.</div>'; return; }

  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function shortHash(h, n) { n = n || 12; return h ? esc(h.slice(0, n)) + "…" : ""; }
  function chip(label, h, cls) { return '<span class="chip ' + (cls||"") + '" title="' + esc(h) + '">' + esc(label) + ' <b>' + shortHash(h) + '</b></span>'; }

  function params() { var o = {}; location.search.replace(/^\?/, "").split("&").forEach(function (p) { if (!p) return; var kv = p.split("="); o[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ""); }); return o; }
  var qr = params().qr;
  var p = qr ? D.provenance[qr] : null;

  var head = '<div class="back">← <a href="index.html">OvenClear /verify</a></div>' +
    '<div class="head"><span class="logo">🥖✅</span><span class="name">Oven<b>Clear</b> · label provenance</span></div>' +
    '<div class="disclosure"><span class="tag">FIXTURE</span><span>Offline demo data — this is the public page a real QR would resolve to. Synthetic business + synthetic law; not legal advice.</span></div>';

  if (!p) {
    var H = [head];
    H.push('<div class="card"><div class="pad">');
    H.push('<h3 class="sec" style="margin-top:2px">Pick a label to inspect</h3>');
    H.push('<div class="muted" style="font-size:13px">Each QR on a printed OvenClear label resolves to one of these provenance records.</div>');
    H.push('<div class="pickers">');
    Object.keys(D.provenance).forEach(function (k) {
      var e = D.provenance[k];
      H.push('<a href="label.html?qr=' + encodeURIComponent(k) + '"><span>' + esc(e.businessName) + ' · ' + esc(e.state) + ' · ' + esc(e.product) + '</span><span class="mono muted">' + (e.issueHistory.length > 1 ? e.issueHistory.length + " issues" : "1 issue") + ' ›</span></a>');
    });
    H.push('</div></div></div>');
    app.innerHTML = H.join("");
    return;
  }

  var hist = p.issueHistory;
  var current = hist[hist.length - 1] || {};
  var H = [head];
  H.push('<div class="card"><div class="pad"><div class="top">');
  H.push('<div>');
  H.push('<div class="kv">cottage-food operation · ' + esc(p.state) + (p.lawWatch ? ' · Law-Watch subscriber' : '') + '</div>');
  H.push('<div class="biz">' + esc(p.businessName) + '</div>');
  H.push('<div class="sub">' + esc(p.product) + '</div>');
  H.push('<span class="status">✓ label current &amp; QA-verified</span>');
  H.push('<div class="mandated"><span class="k">mandated statement on this label</span>' + esc(p.mandatedSentence) + '</div>');
  H.push('<div class="chiprow">');
  H.push('<span class="chip">qr <b>' + esc(p.qrId) + '</b></span>');
  H.push(chip("current label", current.labelId));
  H.push(chip("sha256", current.sha256));
  H.push(chip("law snapshot", (current.snapshotHashes || [])[0], "snap"));
  H.push('</div>');
  H.push('</div>');
  H.push('<div><div class="qr">' + p.qrSvg + '</div><div class="qr-cap">' + esc(p.qrUrl) + '</div></div>');
  H.push('</div>');

  // issue history timeline (newest last, "current" flagged)
  H.push('<h3 class="sec">Issue history</h3>');
  H.push('<div class="muted" style="font-size:13px">' + (hist.length > 1 ? 'This label was automatically re-issued when the law changed — the full chain is public.' : 'Issued once; no law change has affected it yet.') + '</div>');
  H.push('<ul class="timeline">');
  hist.forEach(function (h, i) {
    var isCurrent = i === hist.length - 1;
    H.push('<li class="ti' + (isCurrent ? ' current' : '') + '"><span class="dot"></span>');
    H.push('<div class="when">' + esc(h.issuedAt) + (isCurrent ? '  · current' : '') + '</div>');
    H.push('<div class="lid">' + esc(h.labelId) + '  ·  pack ' + esc(h.packVersion) + '</div>');
    if (h.reissueOf) H.push('<div class="reason">re-issue of ' + esc(h.reissueOf) + (h.reissueReason ? ' — ' + esc(h.reissueReason) : '') + '</div>');
    else H.push('<div class="reason">original issue</div>');
    H.push('<div class="meta">' + chip("sha256", h.sha256) + chip("law snapshot", (h.snapshotHashes || [])[0], "snap") + '<span class="signed"><span class="d"></span> QA-passed &amp; ledgered</span></div>');
    H.push('</li>');
  });
  H.push('</ul>');
  H.push('</div></div>');
  app.innerHTML = H.join("");
})();
</script>
</body>
</html>
